[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
ide-core = { path = "crates/ide-core" }
ide-ui = { path = "crates/ide-ui" }
ide-syntax = { path = "crates/ide-syntax" }
ide-lsp = { path = "crates/ide-lsp" }
ide-workspace = { path = "crates/ide-workspace" }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
futures = "0.3"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde_json = "1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
insta = "1"
ropey = { version = "1.6", default-features = false, features = ["simd"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
tempfile = "3"
ec4rs = "1.2"
toml = "1"
regex = "1"
nucleo-matcher = "0.3"
proptest = "1"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
ignore = "0.4"
notify-debouncer-mini = "0.7"
trash = { version = "5.2", default-features = false, features = ["chrono"] }
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5"
tree-sitter-php = "0.25"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
